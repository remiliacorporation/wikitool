name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      artifact_version:
        description: "Release version, bare semver (example: 0.3.1)"
        required: true
        type: string
      create_release:
        description: "Create a GitHub Release and attach zips"
        required: false
        type: boolean
        default: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate release dispatch
        id: release
        env:
          RAW: ${{ inputs.artifact_version }}
          CREATE_RELEASE: ${{ inputs.create_release }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          re='^v?[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$'
          if [[ ! "${RAW}" =~ $re ]]; then
            echo "Invalid artifact_version: ${RAW}"
            echo "Expected a bare semver version, e.g. 0.3.1"
            exit 1
          fi
          version="${RAW#v}"
          bash scripts/validate_release_dispatch.sh \
            "$version" "$CREATE_RELEASE" "$RELEASE_REF"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            binary_name: wikitool
          # macos-26 is arm64; macos-26-intel is x64. Keep these explicit so
          # each artifact is built on the native architecture it ships for.
          - os: macos-26-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            binary_name: wikitool
          - os: macos-26
            target: aarch64-apple-darwin
            platform: macos-arm64
            binary_name: wikitool
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            binary_name: wikitool.exe

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Stage pinned Contextmink release pack
        shell: bash
        run: >
          bash scripts/fetch_contextmink.sh
          --platform ${{ matrix.platform }}
          --dest dist/contextmink-dist

      - name: Stage pinned Papertiger release pack
        shell: bash
        run: >
          bash scripts/fetch_papertiger.sh
          --platform ${{ matrix.platform }}
          --dest dist/papertiger-dist

      - name: Build + package versioned release bundle
        run: >
          cargo run --quiet --package wikitool --features maintainer --
          release build-matrix
          --targets ${{ matrix.target }}
          --artifact-version ${{ needs.preflight.outputs.version }}
          --output-dir dist/release-matrix
          --contextmink-dist dist/contextmink-dist
          --papertiger-dist dist/papertiger-dist

      - name: Declare unsigned GitHub macOS release
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle="dist/release-matrix/wikitool-${{ needs.preflight.outputs.version }}-${{ matrix.platform }}"
          bash scripts/declare_unsigned_macos.sh --bundle-dir "$bundle"
          rm -f "${bundle}.zip"
          (cd "$bundle" && zip -qr "../$(basename "$bundle").zip" .)
          (
            cd dist/release-matrix
            shasum -a 256 *.zip | sort -k2 > SHA256SUMS.txt
          )
          echo "::warning::macOS archive is unsigned; Gatekeeper exception instructions are bundled"

      - name: Verify extracted project overlay without setup
        shell: bash
        run: bash scripts/verify_project_overlay.sh "dist/release-matrix/wikitool-${{ needs.preflight.outputs.version }}-${{ matrix.platform }}.zip"

      - name: Test unsigned macOS trust declaration
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/test_unsigned_macos_release.sh

      - uses: actions/upload-artifact@v7
        with:
          name: wikitool-release-${{ needs.preflight.outputs.version }}-${{ matrix.platform }}
          path: dist/release-matrix/wikitool-${{ needs.preflight.outputs.version }}-${{ matrix.platform }}.zip
          if-no-files-found: error

  publish-release:
    if: inputs.create_release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: release-zips
          pattern: wikitool-release-${{ needs.preflight.outputs.version }}-*
          merge-multiple: true

      - name: List downloaded assets
        run: ls -lh release-zips/

      - name: Generate release checksums
        run: |
          cd release-zips
          sha256sum *.zip | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          # Keep a Changelog headings: "## [x.y.z] - date". Capture the body
          # up to the next "## " heading; fail if the section is missing so a
          # release can never ship without written notes.
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            /^## / { if (found) exit }
            found { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "CHANGELOG.md has no section for ${VERSION}; add one before releasing." >&2
            exit 1
          fi
          cat release_body.md
        env:
          VERSION: ${{ needs.preflight.outputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.preflight.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "wikitool ${{ needs.preflight.outputs.version }}" \
            --notes-file release_body.md \
            release-zips/*.zip \
            release-zips/SHA256SUMS.txt
