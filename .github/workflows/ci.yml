name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  rust-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cargo tests
        run: cargo test --workspace --all-features
      - name: Generated CLI reference is current
        run: |
          cargo run --quiet --package wikitool --features maintainer -- docs generate-reference --output /tmp/wikitool-reference.md
          diff -u docs/wikitool/reference.md /tmp/wikitool-reference.md
      - name: Release dispatch guard
        run: bash tests/release_dispatch.sh

  cli-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Default features on purpose: these tests launch the end-user binary.
      # The rust-tests job runs the same tests against the maintainer build.
      - name: Public CLI regressions against the default binary
        run: cargo test --package wikitool
      # rust-tests runs on Linux only; this covers the Windows ACL and ownership
      # code that protects stored source-session cookies. It also runs after a
      # failed CLI step, because its panics print the full storage error.
      - name: Source-session storage tests on Windows
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: cargo test --package wikitool_core --lib source::session

  rust-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      # Stable toolchain: avoids the maintenance and spurious red of a pinned
      # nightly. Only goes red on real fmt/clippy issues in committed code.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
