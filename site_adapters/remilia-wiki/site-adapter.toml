schema_version = "site_adapter_v2"
adapter_id = "remilia-wiki"
docs_profile = "mw-1.46-site-authoring"
guidance_documents = ["editorial.md", "research.md", "style.md", "review.md", "categories.md", "extensions.md", "templates.md", "visual_subjects.md"]

[authoring]
require_short_description = true
short_description_forms = ["magic_word:SHORTDESC"]
require_article_quality_banner = true
article_quality_template = "Template:Article quality"
article_quality_default_state = "unverified"
required_appendix_sections = ["References"]
references_template = "Template:Reflist"
prefer_sentence_case_headings = true
prefer_wikitext_only = true
forbid_markdown = true
require_straight_quotes = true

[citations]
use_named_references = true
leave_archive_fields_blank = false

[[citations.preferred_templates]]
family = "web"
template_title = "Template:Cite web"

[[citations.preferred_templates]]
family = "tweet"
template_title = "Template:Cite tweet"

[[citations.preferred_templates]]
family = "news"
template_title = "Template:Cite news"

[[citations.preferred_templates]]
family = "post"
template_title = "Template:Cite post"

[[citations.preferred_templates]]
family = "video"
template_title = "Template:Cite video"

[[citations.source_review_rules]]
label = "Wikipedia"
host = "wikipedia.org"
reason = "Tertiary source: inspect and cite the underlying source for article claims; direct use needs an explicit article-specific reason."

[[citations.source_review_rules]]
label = "IQ.wiki"
host = "iq.wiki"
reason = "Community-edited tertiary wiki: cite the underlying source it summarizes where it has one."

[[citations.source_review_rules]]
label = "Know Your Meme"
host = "knowyourmeme.com"
reason = "Meme database that summarizes originals: cite the original post or artifact where it gives one."

[[citations.source_review_rules]]
label = "NFT Price Floor"
host = "nftpricefloor.com"
reason = "Aggregator data may be volatile or methodology-dependent; verify the exact metric, timestamp, and primary record."

[[citations.source_review_rules]]
label = "Urban Dictionary"
host = "urbandictionary.com"
reason = "User-submitted definitions: citable for how a term is used; cite the original usage where one is known."

[[citations.source_review_rules]]
label = "Remilia Wiki"
host = "wiki.remilia.org"
reason = "A retrieval aid, not independent confirmation: inspect its underlying citations and cite them, unless the wiki page itself is the artifact under discussion."

[templates]

[[templates.infobox_preferences]]
subject_type = "Person"
template_title = "Template:Infobox person"

[[templates.infobox_preferences]]
subject_type = "Organization/Group"
template_title = "Template:Infobox organization"

[[templates.infobox_preferences]]
subject_type = "NFT Collection"
template_title = "Template:Infobox NFT collection"

[[templates.infobox_preferences]]
subject_type = "Artwork"
template_title = "Template:Infobox artwork"

[[templates.infobox_preferences]]
subject_type = "Website/Platform"
template_title = "Template:Infobox website"

[[templates.infobox_preferences]]
subject_type = "Concept/Philosophy"
template_title = "Template:Infobox concept"

[[templates.infobox_preferences]]
subject_type = "Exhibition"
template_title = "Template:Infobox exhibition"

[[templates.infobox_preferences]]
subject_type = "Meme"
template_title = "Template:Infobox meme"

[[templates.infobox_preferences]]
subject_type = "Online community"
template_title = "Template:Infobox online community"

[[templates.infobox_preferences]]
subject_type = "Term"
template_title = "Template:Infobox term"

[[templates.infobox_preferences]]
subject_type = "General/Other"
template_title = "Template:Infobox subject"

[categories]
preferred_categories = []

[lint]
forbid_curly_quotes = true
citation_needed = "error"
proper_nouns = ["Webring", "Milady", "Remilia", "Remilio", "Radbro", "Bonkler", "Pixelady", "Schizo"]
forbid_placeholder_fragments = [
  "[Author Name]",
  "INSERT_SOURCE_URL",
  "2025-XX-XX",
  "https://www.example.com/source",
  "citeturn0search0",
  "contentReference[oaicite:0]",
  "oai_citation",
  "attached_file:1",
  "[cite_start]",
  "[cite: N]",
]

[[extension_contracts]]
kind = "tag"
name = "math"
provider = "Math"
syntax = "paired"
body_required = true

[[extension_contracts]]
kind = "tag"
name = "syntaxhighlight"
provider = "SyntaxHighlight"
syntax = "paired"
body_required = true
attributes = ["lang"]

[[extension_contracts]]
kind = "tag"
name = "poem"
provider = "Poem"
syntax = "paired"
body_required = true

[[extension_contracts]]
kind = "parser_function"
name = "preservationimage"
provider = "PreservationArchive"
syntax = "parser_function"
body_required = false

[[extension_contracts]]
kind = "parser_function"
name = "preservationaudio"
provider = "PreservationArchive"
syntax = "parser_function"
body_required = false

[[extension_contracts]]
kind = "parser_function"
name = "ev"
provider = "EmbedVideo"
syntax = "parser_function"
body_required = false

[[extension_contracts]]
kind = "tag"
name = "tabber"
provider = "TabberNeue"
syntax = "paired"
body_required = true

[[extension_contracts]]
kind = "tag"
name = "gallery"
provider = "core"
syntax = "paired"
body_required = true
attributes = ["mode", "widths", "heights", "perrow"]

[[extension_contracts]]
kind = "tag"
name = "dpl"
provider = "DPL4"
syntax = "paired"
body_required = true

[[extension_contracts]]
kind = "tag"
name = "categorytree"
provider = "CategoryTree"
syntax = "paired"
body_required = true

[[extension_contracts]]
kind = "template"
name = "lang"
provider = "core"
syntax = "template"
body_required = false

[[extension_contracts]]
kind = "module"
name = "D3Chart"
provider = "local"
syntax = "module_invoke"
body_required = false

# The Remilia ontology types the wiki's pages and infobox fields (RSV-D867).
# The wiki's own terms use the wiki: namespace until an intake moves them.
[ontology]
product = "remilia-wiki"
source = "https://ontology.remilia.org/"
local_prefix = "wiki"
local_namespace = "https://wiki.remilia.org/ns/"
